name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch supersedes the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Every step runs in the app: supabase/, the configs and the tests all live
    # there now. The one exception is `npm ci`, which has to run at the
    # workspace root — see below.
    defaults:
      run:
        working-directory: apps/reference

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # At the root, not in the app: npm installs and links every workspace from
      # the root lockfile, and there is no lockfile under apps/reference.
      - name: Install dependencies
        run: npm ci
        working-directory: .

      # Pinned deliberately. With `latest`, CI silently changes behaviour over
      # time: a newer CLI stopped wiring the legacy service_role JWT to the
      # service_role Postgres role, and the only symptom was an admin client
      # getting "permission denied" in a test that looked unrelated. Bump this on
      # purpose, with the suite as the check.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.100.1

      - name: Start Supabase
        run: supabase start

      # Derived from the running stack rather than copied from .env.example, so a
      # CLI change to key formats cannot leave CI running against stale
      # credentials.
      - name: Provide local environment
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"

          # Probe rather than assume. Which key name maps to the service_role
          # Postgres role depends on CLI version, and picking wrong surfaces much
          # later as "permission denied" from createAdminClient — in a test that
          # looks unrelated. Checking here fails fast and says why.
          ADMIN_KEY=""
          for candidate in "${SERVICE_ROLE_KEY:-}" "${SECRET_KEY:-}"; do
            [ -z "$candidate" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "$API_URL/rest/v1/invitations?select=email&limit=1" \
              -H "apikey: $candidate" -H "authorization: Bearer $candidate")
            echo "candidate key -> HTTP $code"
            if [ "$code" = "200" ]; then ADMIN_KEY="$candidate"; break; fi
          done

          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::No key reported by supabase status can bypass RLS. createAdminClient cannot work."
            exit 1
          fi

          cat > .env <<EOF
          VITE_SUPABASE_URL=$API_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY
          SUPABASE_SECRET_KEY=$ADMIN_KEY
          PUBLIC_APP_URL=http://127.0.0.1:3010
          EOF
          echo "Wrote .env for API $API_URL"

      - name: Typecheck
        run: npm run typecheck

      # Includes the RLS integration suite — 19 checks against PostgREST with the
      # application not running — which skips itself when the stack is
      # unreachable, so the step below asserts nothing was skipped.
      - name: Unit and integration tests
        run: npm run test -- --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Fail if any test was skipped
        run: |
          python3 - <<'PY'
          import json, sys
          data = json.load(open("vitest-results.json"))
          skipped = [
              t["fullName"]
              for r in data.get("testResults", [])
              for t in r.get("assertionResults", [])
              if t.get("status") in ("pending", "skipped", "todo")
          ]
          if skipped:
              print("Tests were skipped, which in CI means they did not really run:")
              for name in skipped:
                  print(f"  - {name}")
              sys.exit(1)
          print("No skipped tests.")
          PY

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/reference/playwright-report/
            apps/reference/test-results/
          retention-days: 7
