name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch supersedes the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The committed .env.example holds the Supabase CLI's fixed local-dev
      # defaults, identical on every machine, so it doubles as the CI config.
      # src/lib/env.ts validates at module load, so the unit suite needs this
      # file to exist before anything imports it.
      - name: Provide local environment
        run: cp .env.example .env

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Typecheck
        run: npm run typecheck

      # Includes the RLS integration suite — 19 checks against PostgREST with the
      # application not running — which skips itself when the stack is
      # unreachable, so the step below asserts nothing was skipped.
      - name: Unit and integration tests
        run: npm run test -- --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Fail if any test was skipped
        run: |
          python3 - <<'PY'
          import json, sys
          data = json.load(open("vitest-results.json"))
          skipped = [
              t["fullName"]
              for r in data.get("testResults", [])
              for t in r.get("assertionResults", [])
              if t.get("status") in ("pending", "skipped", "todo")
          ]
          if skipped:
              print("Tests were skipped, which in CI means they did not really run:")
              for name in skipped:
                  print(f"  - {name}")
              sys.exit(1)
          print("No skipped tests.")
          PY

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
