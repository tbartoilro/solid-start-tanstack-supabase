name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch supersedes the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      # Derived from the running stack rather than copied from .env.example.
      # The committed defaults are correct for the CLI version this repo was
      # developed against, and this job installs `latest` — trusting them cost a
      # debugging cycle where a mismatched service key surfaced as "invitation
      # not valid". Asking the stack removes the whole class of problem.
      - name: Provide local environment
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"

          # SERVICE_ROLE_KEY first, SECRET_KEY as fallback. The newer key format
          # is not always wired to the service_role Postgres role depending on
          # CLI version, which surfaced as "permission denied for table
          # invitations" from the admin client — sixty seconds later, as an
          # unrelated-looking e2e failure.
          ADMIN_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::supabase status reported neither SERVICE_ROLE_KEY nor SECRET_KEY"
            exit 1
          fi

          cat > .env <<EOF
          VITE_SUPABASE_URL=$API_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY
          SUPABASE_SECRET_KEY=$ADMIN_KEY
          PUBLIC_APP_URL=http://127.0.0.1:3010
          EOF
          echo "Wrote .env for API $API_URL"

      # Asserts the assumption the previous step just made, instead of letting a
      # wrong key show up much later as a confusing test failure. createAdminClient
      # is expected to bypass RLS; if this key cannot read a protected table, it
      # is not a service key and nothing downstream will work.
      - name: Verify the admin key really bypasses RLS
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          ADMIN_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$API_URL/rest/v1/invitations?select=email&limit=1" \
            -H "apikey: $ADMIN_KEY" -H "authorization: Bearer $ADMIN_KEY")
          echo "invitations read with admin key -> HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::The admin key does not bypass RLS (HTTP $status). createAdminClient will fail."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      # Includes the RLS integration suite — 19 checks against PostgREST with the
      # application not running — which skips itself when the stack is
      # unreachable, so the step below asserts nothing was skipped.
      - name: Unit and integration tests
        run: npm run test -- --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Fail if any test was skipped
        run: |
          python3 - <<'PY'
          import json, sys
          data = json.load(open("vitest-results.json"))
          skipped = [
              t["fullName"]
              for r in data.get("testResults", [])
              for t in r.get("assertionResults", [])
              if t.get("status") in ("pending", "skipped", "todo")
          ]
          if skipped:
              print("Tests were skipped, which in CI means they did not really run:")
              for name in skipped:
                  print(f"  - {name}")
              sys.exit(1)
          print("No skipped tests.")
          PY

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
